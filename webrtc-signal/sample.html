  <script type="module">

 
 const socket = io("https://192.168.41.58:9000");
//  , {key : readFileSync('./cert/cert.key'),

// const roomid = crypto.randomUUID();

//get roomid if exists
const params = new URLSearchParams(window.location.search);
const roomId = params.get("room");


let activeRoomId = null;
let isSender = false;
let selectedFile = null;
const fileChunkSize = 16 * 1024;
const MAX_BUFFERED_AMOUNT = 1024 * 1024;
const bufferedAmountLowThreshold  = 512 * 1024;
let incomingFileMeta = null;
let receivedChunks = [];
let receivedChunkCount = 0;
let expectedChunkIndex = null;
let RSA_KEY_PAIR = null;
let FILECHUNK_ENCRYPTION_KEY = null;
let REMOTE_RSA_PUBLIC_KEY = null;




//asymmetric key generation
async function generateRSAKeyPair() {
    RSA_KEY_PAIR = await crypto.subtle.generateKey(
        {
            name: "RSA-OAEP",
            modulusLength: 2048,
            publicExponent: new Uint8Array([1, 0, 1]),
            hash: "SHA-256"
        },
        true,
        ["encrypt", "decrypt"]
    );
    return RSA_KEY_PAIR;
}

//exporting RSA public key
async function exportRSAPublicKey(publicKey) {
    const exported = await crypto.subtle.exportKey(
        "spki",
        publicKey
    );
    return exported;
}

//importing RSA public key
async function importRSAPublicKey(keyArray){
    const keyBuffer = new Uint8Array(keyArray).buffer;

    return await crypto.subtle.importKey(
        "spki",
        keyBuffer,
        {
            name: "RSA-OAEP",
            hash: "SHA-256"
        },
        true,
        ["encrypt"]
    );
}


// symmetric key generation
async function SymmetricKeyGenerate(){
    const aesKey = await crypto.subtle.generateKey(
        {
            name : "AES-GCM",
            length : 256
        },
        true,
        ["encrypt", "decrypt"]
    );
    FILECHUNK_ENCRYPTION_KEY = aesKey;

      return aesKey;
}

//export aeskey
async function exportAESKey(AESkey) {
    const key = await crypto.subtle.exportKey("raw",AESkey);
    return key;
    
}

//encrypt AESkey
async function encryptAESKey(RSAPublicKey,AESKey){
    const rawKey = exportAESKey(AESKey);
    const encryptedKey = await crypto.subtle.encrypt(
        {name : "RSA-OAEP"},
        RSAPublicKey,
        rawKey

    );
return encryptedKey;

}

//decrypt AESkey
async function decryptAESKey(encryptedKey, RSAPrivateKey){
    const raw = await crypto.subtle.decrypt(
        {name : "RSA-OAEP"},
        RSAPrivateKey,
        encryptedKey
    );

    return await crypto.subtle.importKey(
        "raw",
         raw,
        { name: "AES-GCM" },
        true,
        ["encrypt", "decrypt"]
    )
}

//encrypt chunk
async function encryptChunk(buffer){
    
    const iv = crypto.getRandomValues(new Uint8Array(12));

    const encryptedChunk = await crypto.subtle.encrypt(
        {
            name : "AES-GCM",
            iv
        }
        ,
        FILECHUNK_ENCRYPTION_KEY,
        buffer
    );

    return {
        iv,
        encryptedChunk
    };

};

//decrypt chunk
async function decryptChunk(iv,encryptedChunk){
    const decryptedChunk = await crypto.subtle.decrypt(
        {
            name : "AES-GCM",
            iv
        },
        FILECHUNK_ENCRYPTION_KEY,
        encryptedChunk
    );

}



socket.on('connect', ()=>{
    console.log('connected to server:',socket.id);
    if(roomId){
   socket.emit('join-room',{ roomId });
   activeRoomId=roomId;
}
    
});

const configuration = {'iceServers' : [{'urls':'stun:stun.l.google.com:19302'}]};
const peerConnection = new RTCPeerConnection(configuration);
let dataChannel;

peerConnection.addEventListener('datachannel', (event) =>{
     dataChannel = event.channel;
    setupDataChannel(dataChannel);
});



const messageBox = document.querySelector('.messageBox input');
const sendButton = document.querySelector('.sendbutton button');
const incommingMessage = document.querySelector('.incommingMessages');
const fileButton = document.querySelector('#sendFile');
const attachFile = document.querySelector('#fileInput');
const incommingFile = document.querySelector('.incommingFile');
const shareSection = document.getElementById("shareSection");
const shareLink = document.getElementById("shareLink");
const qrDiv = document.getElementById("qr");


 function setupDataChannel(dataChannel){
dataChannel.binaryType = "arraybuffer";    
dataChannel.addEventListener('open', async (event)=>{
    messageBox.disabled = false;
    messageBox.focus();
    sendButton.disabled = false;
    dataChannel.bufferedAmountLowThreshold = bufferedAmountLowThreshold;
       if(!isSender){
        await generateRSAKeyPair();

         const publicKeyBuffer = await exportRSAPublicKey(RSA_KEY_PAIR.publicKey);

         dataChannel.send(JSON.stringify({
            type: "rsa-public-key",
            key: Array.from(new Uint8Array(publicKeyBuffer))
         }));
       }
       if (isSender && selectedFile && peerConnection.connectionState === 'connected') {
            console.log('Sending file now...');
            const chunks  = filechunking(selectedFile,fileChunkSize);
            const header = fileMetaGeneration(selectedFile,chunks.length);
            dataChannel.send(JSON.stringify(header));

            sendDataChunks(dataChannel, chunks);
        }

        

});

dataChannel.addEventListener('close', (event)=>{
    messageBox.disabled = true;
    sendButton.disabled = true;
});


dataChannel.addEventListener('message', async (event) => {

 
  if (typeof event.data === 'string') {
    const msg = JSON.parse(event.data);

    if (msg.type === "file-Header") {
      incomingFileMeta = msg;
      receivedChunks = new Array(msg.totalChunks);
      receivedChunkCount = 0;
      console.log("file header received", incomingFileMeta);
      



     
      return;
    }

    if (msg.type === "file-chunk-meta") {
      expectedChunkIndex = msg.index;
      return;
    }

    if(msg.type === "rsa-public-key"){
        REMOTE_RSA_PUBLIC_KEY = await importRSAPublicKey(msg.key);
        const symmetricKey = await SymmetricKeyGenerate();
        const EncryptedAES = await encryptAESKey(REMOTE_RSA_PUBLIC_KEY,symmetricKey);
        dataChannel.send(JSON.stringify({
            type : "encrypted-aes-key",
            key : Array.from(new Uint8Array(EncryptedAES))
        }));

        console.log("RSA public key received ,imported");
        return;
    }

    if(msg.type === "encrypted-aes-key"){
        const encryptedKey = new Uint8Array(msg.key).buffer;
        FILECHUNK_ENCRYPTION_KEY = await decryptAESKey(encryptedKey,RSA_KEY_PAIR.privateKey);

        console.log("AES session key decrypted & ready");
    return;
    }

    // normal chat message
    const p = document.createElement('p');
    p.textContent = msg;
    incommingMessage.appendChild(p);
    return;
  }

  
  if (event.data instanceof ArrayBuffer) {
    if (expectedChunkIndex === null) {
      console.error("Binary arrived without metadata");
      return;
    }

    receivedChunks[expectedChunkIndex] = event.data;
    receivedChunkCount++;
    expectedChunkIndex = null;

    if (receivedChunkCount === incomingFileMeta.totalChunks) {
      assembleAndDownload();
    }
  }
});




 }
 sendButton.addEventListener('click', ()=>{
    const message = messageBox.value;
    console.log(dataChannel);
    if (!dataChannel || dataChannel.readyState !== "open") {
        console.log("DataChannel not ready");
        return;
    }
    dataChannel.send(messageBox.value);
});

attachFile.addEventListener('change',(event)=>{

//backend response with roomid

activeRoomId = roomId;

//initiator
socket.on('initiator', async (data)=>{
    const roomId = data.roomId;
    console.log('initiating by second peer');
    
    const offer = await peerConnection.createOffer();
    await peerConnection.setLocalDescription(offer);

});

//offer
socket.on('offer', async (data)=>{
    const roomId = data.roomId;
    console.log("received offer");
    await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
    const answer = await peerConnection.createAnswer();
    await peerConnection.setLocalDescription(answer);
    socket.emit('answer',{ answer, roomId});
});

//answer
socket.on('answer', async (data)=>{
    console.log('received answer');
    const remotedesc = new RTCSessionDescription(data.answer);
    await peerConnection.setRemoteDescription(remotedesc);
});



//new-ice-candidate
socket.on('new-ice-candidate', async (data)=>{
    console.log('received ICE');
    if(data.candidate){
        try{
            if(peerConnection.remoteDescription){
                await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
        
            }
        }catch(e){
            console.error('error adding received ice candidate', e);
        }
    }
});

//ice candidates
peerConnection.addEventListener('icecandidate', (event)=>{
    if(event.candidate){
        console.log('sending ICE');
        socket.emit('new-ice-candidate',{ candidate: event.candidate,  roomId: activeRoomId});
    }
});

//file chunking
function filechunking(selectedFile,fileChunkSize){
    if(!selectedFile){
        return;
    }
    const chunks = [];
    let offset = 0;
    let index = 0;

     const file = selectedFile.file;


    while(offset < file.size){
        
        const chunk = file.slice(offset,offset+fileChunkSize);
        chunks.push({
            index:index,
            chunk:chunk
        });

        index++;
        offset += fileChunkSize;

        

    }
     return chunks;
}
    //file meta data generation
function fileMetaGeneration(selectedFile,totalChunks){
    if(!selectedFile){
        return;
    }
    const file = selectedFile.file;

    return({
        type : "file-Header",
        fileName : file.name,
        fileSize : file.size,
        fileType: file.type,
        totalChunks : totalChunks,
        fileChunkSize : fileChunkSize,
        fileId:selectedFile.fileId


    });


}

//sending data chunks
async function sendDataChunks(dataChannel, chunks) {
    let index = 0;
    dataChannel.bufferedAmountLowThreshold = bufferedAmountLowThreshold;
    while (index < chunks.length) {

       
       if (dataChannel.bufferedAmount > MAX_BUFFERED_AMOUNT) {
            console.log("Buffer full, waiting...");
            await new Promise(resolve => {
                const handler = () => {
                    dataChannel.removeEventListener('bufferedamountlow', handler);
                    resolve();
                };
                dataChannel.addEventListener('bufferedamountlow', handler);
            });
        }

        const chunkObj = chunks[index];

       
        dataChannel.send(JSON.stringify({
            type: "file-chunk-meta",
            index: chunkObj.index
        }));

        
       try {
            const buffer = await chunkObj.chunk.arrayBuffer();
            dataChannel.send(buffer);
        } catch (err) {
            console.error("Error reading chunk:", err);
            return;
        }
        index++;

        const progress = Math.round((index/chunks.length)*100);
        console.log(`sending: ${progress}%`);
    }

    console.log("All chunks sent");
}


// assembling the chunks
function assembleAndDownload(){
    for (let i = 0; i < incomingFileMeta.totalChunks; i++) {
        if (!receivedChunks[i]) {
            console.error(`File corrupted: Missing chunk index ${i}`);
            alert("Transfer failed: Packet loss detected.");
            return;
        }
    }
    const blob = new Blob(receivedChunks,{
        type: incomingFileMeta.fileType 
    });
    if (blob.size !== incomingFileMeta.fileSize) {
        console.error(`Size mismatch! Expected ${incomingFileMeta.fileSize}, got ${blob.size}`);
        alert("File corrupted: Size mismatch.");
        return;
    }
    console.log("File assembled successfully. Size:", blob.size);
    const url = URL.createObjectURL(blob);

    download(url,incomingFileMeta.fileName);

    incomingFileMeta = null;
    receivedChunks = [];
    receivedChunkCount = 0;

}


//download the given file
function download(url, fileName){
    const a = document.createElement("a");
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
}
